<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <!-- Original illustration for Kalinga: Ancient Trade Routes. CC BY-SA 4.0. -->
  <title id="title">Compass hint</title>
  <desc id="desc">A single compass needle inside a circle, pointing, used to give a gentle direction hint without stating any historical fact.</desc>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="24" />
    <path d="M32,14 L37,32 L32,36 L27,32 Z" fill="currentColor" stroke="none" />
    <path d="M32,50 L29,36 L32,33 L35,36 Z" fill="currentColor" stroke="none" opacity="0.5" />
    <circle cx="32" cy="32" r="3" fill="currentColor" stroke="none" />
  </g>
</svg>
