  <title id="title">Good name</title>
  <desc id="desc">One plain sentence describing what the icon shows, e.g. "A cluster of black peppercorns on a stem, drawn as a simple line icon."</desc>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="20" />
    <path d="M32,16 L32,48 M16,32 L48,32" />
  </g>
</svg>
